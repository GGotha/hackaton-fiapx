apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# minikube-friendly overlay: locally-built images, single replicas (worker stays
# at 2), and smaller resource footprints so the whole stack fits one node.

resources:
  - ../../base

replicas:
  - name: api
    count: 1
  - name: app
    count: 1

patches:
  # Use images already present on the node (built via `minikube image build` /
  # `eval $(minikube docker-env)`), never pull from a registry.
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: StatefulSet
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - path: patches/worker-resources.yaml
  - path: patches/postgres-resources.yaml
  - path: patches/rabbitmq-resources.yaml
  - path: patches/minio-resources.yaml
