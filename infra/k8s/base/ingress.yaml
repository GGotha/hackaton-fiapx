apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fiapx
  labels:
    app: fiapx
  annotations:
    # Uploads flow through the api host; allow bodies up to MAX_VIDEO_MB.
    nginx.ingress.kubernetes.io/proxy-body-size: 200m
spec:
  ingressClassName: nginx
  rules:
    - host: fiapx.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 80
    - host: api.fiapx.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3000
    - host: auth.fiapx.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  number: 3001
