_format_version: '3.0'
_transform: true

services:
  - name: auth
    url: http://auth:3001
    routes:
      - name: auth
        paths:
          - /api/auth
        strip_path: false
        preserve_host: true

  - name: api
    url: http://api:3000
    routes:
      - name: api-videos
        paths:
          - /api/videos
        strip_path: false
        preserve_host: true
      - name: api-docs
        paths:
          - /api/docs
        strip_path: false
        preserve_host: true
      - name: api-socket
        paths:
          - /socket.io
        strip_path: false
        preserve_host: true
